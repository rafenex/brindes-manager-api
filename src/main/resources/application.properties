spring.application.name=brindes-manager-api

server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/brindesdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:brindes}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:brindes}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.jwt.secret=${APP_JWT_SECRET:brindes-manager-api-secret-key-local-development-precisa-ter-tamanho-grande-123456789}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}