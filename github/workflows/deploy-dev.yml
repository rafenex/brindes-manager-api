name: Deploy DEV

on:
  push:
    branches:
      - dev

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: brindesdb
          POSTGRES_USER: brindes
          POSTGRES_PASSWORD: brindes
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U brindes -d brindesdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/brindesdb
      SPRING_DATASOURCE_USERNAME: brindes
      SPRING_DATASOURCE_PASSWORD: brindes
      APP_JWT_SECRET: brindes-manager-api-secret-key-ci-precisa-ter-tamanho-grande-123456789
      APP_JWT_EXPIRATION_MS: 86400000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Give execute permission to Maven wrapper
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean verify

  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Update application
        run: |
          cd /home/ubuntu/apps/brindes-manager-api
          git fetch origin
          git checkout dev
          git reset --hard origin/dev
          docker compose -f docker-compose.dev.yml up -d --build